spring.application.name=visionary-backend

spring.datasource.url=jdbc:postgresql://ep-shiny-paper-atbm0cr3-pooler.c-9.us-east-1.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_jMSIkEfv1Y0s
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.forma
t_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

server.port=8080


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.mail.enabled=false

logging.level.root=INFO
logging.level.com.visionary_backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/resumes

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

resend.api.key=${RESEND_API_KEY:}
app.notification.email=${NOTIFICATION_EMAIL:info@visionaryinspire.com}

