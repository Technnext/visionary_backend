spring.application.name=visionary-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://217.217.251.239:5432/visionary_inspire_db}
spring.datasource.username=${DB_USERNAME:visionary_inspire_user}
spring.datasource.password=${DB_PASSWORD:Visionary@2026}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

server.port=8080


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

logging.level.root=INFO
logging.level.com.visionary_backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ─── File Upload ────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/resumes

# ─── Email (configure SMTP credentials via env vars in production) ──────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false
app.notification.email=info@visionaryinspire.com